<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pulse</title>
<meta name="description" content="Make any image pulse to the beat of a song.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="stage" aria-label="Pulsing image"></canvas>

<main id="setup" class="panel">
  <h1>Pulse</h1>
  <p class="sub">Pick a picture and a song. The picture pulses to the beat.</p>

  <label class="pick" id="pickImage">
    <input type="file" accept="image/*" id="imageInput" hidden>
    <span class="thumb" id="imageThumb">🖼️</span>
    <span class="txt"><b>Image</b><small id="imageName">Tap to choose</small></span>
  </label>

  <label class="pick" id="pickAudio">
    <input type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.flac" id="audioInput" hidden>
    <span class="thumb">🎵</span>
    <span class="txt"><b>Song</b><small id="audioName">Tap to choose</small></span>
  </label>

  <p id="status" class="status" aria-live="polite"></p>

  <button type="button" class="pick details-pick" id="detailsBtnSetup">
    <span class="thumb">✎</span>
    <span class="txt"><b>Song details</b><small id="detailsSummary">Optional · shown on the video and share page</small></span>
  </button>

  <button id="startBtn" class="primary" disabled>Start</button>
</main>

<section id="player" class="panel bottom" hidden>
  <div class="row">
    <button id="playBtn" class="round" aria-label="Play">▶</button>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
    <span id="time" class="time">0:00</span>
  </div>
  <div class="row seg">
    <span class="lbl">Sync to</span>
    <button data-mode="beat" class="on">Beat</button>
    <button data-mode="kick">Kick</button>
    <button data-mode="hits">All hits</button>
    <span id="bpm" class="bpm">…</span>
  </div>
  <div class="row sliders">
    <label>Strength <input type="range" id="intensity" min="0" max="100" value="45"></label>
    <label id="sensLabel">Sensitivity <input type="range" id="sensitivity" min="0" max="100" value="55"></label>
    <label><span class="lab">Offset <span id="offsetVal">0 ms</span></span><input type="range" id="offset" min="-300" max="300" step="10" value="0" aria-label="Sync offset: move right if the picture moves before the beat"></label>
  </div>
  <div class="row presets">
    <span class="lbl">Presets</span>
    <button class="chip" data-preset="chill">Chill</button>
    <button class="chip" data-preset="club">Club</button>
    <button class="chip" data-preset="hype">Hype</button>
    <button id="fxToggle" class="chip" aria-expanded="true" aria-controls="fxGrid">Effects ▾</button>
  </div>
  <div class="fx-grid" id="fxGrid">
    <button class="chip" data-fx="glow">Glow</button>
    <button class="chip" data-fx="shake">Shake</button>
    <button class="chip" data-fx="flash">Flash</button>
    <button class="chip" data-fx="tilt">Tilt</button>
    <button class="chip" data-fx="bounce">Bounce</button>
    <button class="chip" data-fx="echo">Echo</button>
    <button class="chip" data-fx="rings">Rings</button>
    <button class="chip" data-fx="sparks">Sparks</button>
    <button class="chip" data-fx="rgb">RGB split</button>
    <button class="chip" data-fx="bars">Bars</button>
    <button class="chip" data-fx="strobe">Strobe</button>
    <button class="chip" data-fx="round">Circle</button>
  </div>
  <div class="row actions">
    <button id="recordBtn">● Rec</button>
    <button id="shareBtn" class="accent">Share</button>
    <button id="detailsBtn">Details</button>
    <button id="hideBtn">Hide</button>
    <button id="newBtn">New</button>
  </div>
</section>

<div class="sheet" id="detailsSheet" hidden>
  <form class="panel sheet-card" id="detailsForm" novalidate>
    <h2>Song details</h2>
    <p class="note" id="detailsNote" hidden></p>
    <label class="field">Song name <input id="d_title" maxlength="120" autocomplete="off" required></label>
    <label class="field">Artist name <input id="d_artist" maxlength="120" autocomplete="off" required></label>
    <label class="field">Album <span class="opt">optional</span> <input id="d_album" maxlength="120" autocomplete="off"></label>
    <label class="field">Artist website <span class="opt">optional</span> <input id="d_website" type="url" inputmode="url" maxlength="300" placeholder="example.com" autocomplete="url"></label>
    <label class="check"><input type="checkbox" id="d_showCredits" checked> Show song name and artist on the video</label>
    <div class="row">
      <button type="button" data-close>Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</div>

<div class="sheet" id="shareSheet" hidden>
  <div class="panel sheet-card">
    <h2>Share link</h2>
    <p class="share-what"><b id="shareTitle"></b><br><span id="shareSub"></span></p>
    <form id="shareForm">
      <p class="note">Creates a page anyone with the link can open to watch and hear this song with your effects. The picture and song are uploaded.</p>
      <label class="check"><input type="checkbox" id="s_rights" required> I own this music or have permission to share it</label>
      <div id="shareProgress" class="progress" hidden>
        <div class="bar"><span id="shareProgressBar"></span></div>
        <small id="shareProgressLabel">Uploading…</small>
      </div>
      <p class="error" id="shareError" role="alert" hidden></p>
      <div class="row">
        <button type="button" data-close>Cancel</button>
        <button type="submit" class="primary" id="shareCreate">Create link</button>
      </div>
    </form>
    <div id="shareDone" hidden>
      <input id="shareLink" class="link" readonly aria-label="Share link" onclick="this.select()">
      <div class="row">
        <button type="button" id="shareCopy">Copy</button>
        <button type="button" id="shareNative" class="accent">Share…</button>
        <a class="btn" id="shareOpen" target="_blank" rel="noopener">Open</a>
      </div>
      <div class="row"><button type="button" data-close>Done</button></div>
    </div>
  </div>
</div>

<div id="toast" role="status" hidden></div>

<audio id="audio" preload="auto" playsinline></audio>
<script src="/engine.js"></script>
<script src="/app.js"></script>
</body>
</html>
